# Round-robin load balancer in front of N API containers.
# Docker's DNS returns every replica of the `api` service; re-resolving every
# few seconds lets `docker compose up --scale api=N` change the pool live.
events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_max_body_size 400m;
  server {
    listen 8000;
    location / {
      set $upstream http://api:8000;
      proxy_pass $upstream;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
    }
  }
}
