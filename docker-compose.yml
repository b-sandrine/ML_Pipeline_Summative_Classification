# docker compose up -d --build --scale api=3
services:
  api:
    build: .
    expose: ["8000"]
    environment:
      RETRAIN_THRESHOLD: "50"
    volumes:                     # shared so a retrain in one replica reaches all
      - models:/app/models
      - data:/app/data
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2g}

  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:8000"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports: ["8501:8501"]
    environment:
      API_URL: http://nginx:8000
    depends_on: [nginx]

volumes:
  models:
  data:
